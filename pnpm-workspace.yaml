packages:
  - packages/*
  - examples/*
  - e2e/*

# The versions the library and the examples share, so that a bump is one edit. The bare examples
# reference them from `package.json` as `catalog:`, and the generator writes them that way.
catalog:
  react-native-nitro-modules: 0.37.1
  react-native-safe-area-context: ^5.10.1

# Browser-data packages publish almost daily, so an unpinned install trips the workspace's
# minimum-release-age policy on every refresh. Pinned to the newest builds that clear it.
overrides:
  browserslist: 4.29.1
  caniuse-lite: 1.0.30001812
  electron-to-chromium: 1.5.439

# No dependency may run install scripts. Those that ask ship prebuilt binaries through optional
# platform packages, so refusing costs nothing; lefthook's only installs the git hooks, which
# `pnpm exec lefthook install` does instead.
allowBuilds:
  '@fails-components/webtransport-transport-http3-quiche': false
  '@parcel/watcher': false
  lefthook: false
  node-pty: false
  tree-sitter: false
  tree-sitter-javascript: false
  tree-sitter-typescript: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.4'
  - '@expo/config-plugins@58.0.6'
  - '@expo/config@58.0.3'
  - '@expo/image-utils@0.12.4'
  - '@expo/inline-modules@0.2.3'
  - '@expo/local-build-cache-provider@58.0.3'
  - '@expo/log-box@58.0.10'
  - '@expo/metro-config@58.0.9'
  - '@expo/metro-file-map@58.0.4'
  - '@expo/prebuild-config@58.0.9'
  - '@expo/require-utils@58.0.3'
  - '@expo/router-server@58.0.9'
  - babel-preset-expo@58.0.10
  - expo-asset@58.0.12
  - expo-constants@58.0.10
  - expo-file-system@58.0.6
  - expo-font@58.0.7
  - expo-modules-autolinking@58.0.9
  - expo-modules-core@58.0.13
  - expo-modules-jsi@58.0.9
  - expo@58.0.5
