# A link that leaves the page is not followed in it: the app is told, and opens it itself. The
# browser then covers the app. On Android the flow goes back to it with the back button. On iOS a
# flow cannot name the app, so the wrapper brings it back with `launch-app` and then runs
# `navigation-reported`. The browser has to be in front by then, or it covers the app again, and a
# cold Safari on a runner can take a few seconds. The flow cannot await anything meanwhile: iOS
# suspends the app once Safari covers it, and Argent reads the tree of the app it launched, so
# every read times out. It waits instead.
executionPrerequisite: The example app has just launched.
steps:
  - echo: Leaving the page is blocked and reported to the app
  - run: ready
  - tap: { id: note }
  - when: { platform: android }
    steps:
      - wait: 2000
      - tool: button
        args: { button: back }
  - when: { platform: ios }
    steps:
      - wait: 6000
