# A DOM component calls a native action and renders what the app answers.
executionPrerequisite: The example app has just launched and no greeting was clicked.
steps:
  - echo: A click in the DOM reaches the app, and the app's answer reaches the DOM
  - run: ready
  - tap: { id: first-greeting }
  # A slow runner can lose a tap on a web view, and a flow can't retry an await: each tap on one is
  # repeated when its answer has not come. A Debug build has answered after more than 2.5 seconds, and
  # a second tap then counted twice.
  - wait: 6000
  - when: { hidden: { text: The first greeting reported 1 clicks } }
    steps:
      - tap: { id: first-greeting }
  - await: { visible: { text: The first greeting reported 1 clicks }, timeout: 15000 }
  - when: { platform: android }
    steps:
      - await: { visible: { text: 'Clicked 1 times. Odd.' } }
  # A busy runner can take more than the default 7.5 seconds to answer a read of the screen.
  - await: { idle: true, timeout: 30000 }
  - snapshot: { name: first-greeting-answered, cropOn: { id: first-greeting } }
  - tap: { id: first-greeting }
  - wait: 6000
  - when: { hidden: { text: The first greeting reported 2 clicks } }
    steps:
      - tap: { id: first-greeting }
  - await: { visible: { text: The first greeting reported 2 clicks }, timeout: 15000 }
