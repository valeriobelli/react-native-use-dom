# A new prop reaches a rendered DOM component without reloading its page: its state survives.
executionPrerequisite: The example app has just launched and no greeting was clicked.
steps:
  - echo: A prop change re-renders the DOM component and keeps its state
  - run: ready
  - tap: { id: first-greeting }
  # The first tap on a slow runner can still be lost, and a flow can't retry an await: tap again
  # when the answer has not come.
  - wait: 2500
  - when: { hidden: { text: The first greeting reported 1 clicks } }
    steps:
      - tap: { id: first-greeting }
  - await: { visible: { text: The first greeting reported 1 clicks }, timeout: 15000 }
  - tap: { text: Rename to Metro }
  - await: { visible: { text: Rename to React Native } }
  - when: { platform: android }
    steps:
      - await: { visible: { text: 'Hello, Metro. Clicked 1 times.' } }
  - await: { idle: true }
  - snapshot: { name: first-greeting-renamed, cropOn: { id: first-greeting } }
  - tap: { id: first-greeting }
  - await: { visible: { text: The first greeting reported 2 clicks }, timeout: 15000 }
