# The OTA scenario: a hot-updater update changes a DOM component's greeting, keeps its
# localStorage, and rolls back. Needs a Release build with Hot Updater configured and a local
# update server running on port 3000.
#
# The flow runs against the newest stable cell, which carries the hot-updater wiring. The deploy
# and rollback scripts run through `script:` steps and read the build and platform from
# `.argent/scripts/ota/config.json`, which `run.cli.mts` writes before the flow runs.
#
# `hotUpdater.reload()` restarts the JS runtime, so the app's React state resets and it lands back
# on the example app's screen: after every reload the flow waits for the app to come up (`ready`)
# and taps back into the OTA screen.
#
# iOS cannot read inside a WebView, so the greeting and localStorage value are checked on Android
# only; on iOS the screenshots are the proof, as with every other release flow.
executionPrerequisite: The example app has just launched with a Release build, and the local Hot Updater server is running on port 3000.
steps:
  - echo: Open the OTA screen
  - run: ready
  - tap: { id: open-ota }
  - echo: The built-in greeting renders
  - wait: 3000
  - when: { platform: android }
    steps:
      - assert: { visible: { text: 'Built-in greeting' } }
  - snapshot: { name: ota-baseline }
  - echo: Deploy an update that changes the greeting
  - script: { path: ../../scripts/ota/deploy.mjs, timeout: 300000 }
  - echo: Check for the update and apply it; the app reloads itself
  - tap: { id: ota-check }
  - echo: The app restarts with the new greeting
  - wait: 10000
  - run: ready
  - tap: { id: open-ota }
  - when: { platform: android }
    steps:
      - assert: { visible: { text: 'Updated greeting' } }
      - assert: { visible: { text: 'written-before-update' } }
  - wait: 3000
  - snapshot: { name: ota-updated }
  - echo: Roll back to the built-in bundle
  - script: { path: ../../scripts/ota/rollback.mjs, timeout: 60000 }
  - tap: { id: ota-check }
  - wait: 10000
  - run: ready
  - tap: { id: open-ota }
  - when: { platform: android }
    steps:
      - assert: { visible: { text: 'Built-in greeting' } }
  - wait: 3000
  - snapshot: { name: ota-rolled-back }
