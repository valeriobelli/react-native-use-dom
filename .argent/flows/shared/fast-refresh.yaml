# An edit to a DOM component's source reaches its page as a hot update that keeps its state.
# Needs the dev server; the scripts edit and restore the examples' Greeting.tsx.
executionPrerequisite: The example app runs from the dev server, freshly launched, and no greeting was clicked.
steps:
  - echo: Fast Refresh updates the DOM component and keeps its state
  - script: { path: ../../scripts/restore-greeting.mjs }
  - run: ready
  - tap: { id: first-greeting }
  # A slow runner can lose a tap on a web view, and a flow can't retry an await: each tap on one is
  # repeated when its answer has not come. A Debug build has answered after more than 2.5 seconds, and
  # a second tap then counted twice.
  - wait: 6000
  - when: { hidden: { text: The first greeting reported 1 clicks } }
    steps:
      - tap: { id: first-greeting }
  - await: { visible: { text: The first greeting reported 1 clicks }, timeout: 15000 }
  - tap: { id: first-greeting }
  - wait: 6000
  - when: { hidden: { text: The first greeting reported 2 clicks } }
    steps:
      - tap: { id: first-greeting }
  - await: { visible: { text: The first greeting reported 2 clicks }, timeout: 15000 }
  - script: { path: ../../scripts/edit-greeting.mjs }
  - when: { platform: android }
    steps:
      - await: { visible: { text: 'Pressed 2 times.' }, timeout: 15000 }
  - wait: 3000
  # A busy runner can take more than the default 7.5 seconds to answer a read of the screen.
  - await: { idle: true, stableFor: 500, timeout: 30000 }
  - snapshot: { name: first-greeting-refreshed, cropOn: { id: first-greeting } }
  - tap: { id: first-greeting }
  - wait: 6000
  - when: { hidden: { text: The first greeting reported 3 clicks } }
    steps:
      - tap: { id: first-greeting }
  - await: { visible: { text: The first greeting reported 3 clicks } }
  - script: { path: ../../scripts/restore-greeting.mjs }
