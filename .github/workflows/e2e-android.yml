name: E2E Android

# Runs one job per cell of e2e/matrix.json whose role is the `role` input: builds the cell's example in
# Release and Debug, boots an emulator and runs the release and dev flows.
# Sources: https://github.com/ReactiveCircus/android-emulator-runner (KVM step, inputs) and
# https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md (the runner image).

on:
  workflow_call:
    inputs:
      role:
        description: Which cells of e2e/matrix.json to run, by their role
        type: string
        default: blocking
  workflow_dispatch:
    inputs:
      role:
        description: Which cells of e2e/matrix.json to run, by their role
        type: choice
        options:
          - blocking
          - floor
        default: blocking
      update-baselines:
        description: Write new screenshot baselines on this runner and upload them, instead of comparing
        type: boolean
        default: false

permissions: {}

jobs:
  # Reads the cells with the requested role from the matrix file, so that no version or app is named here.
  cells:
    name: Read the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cells: ${{ steps.read.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        env:
          ROLE: ${{ inputs.role || 'blocking' }}
        run: |
          cells=$(jq -c --arg role "$ROLE" '[.cells[] | select(.role == $role)]' e2e/matrix.json)
          echo "$cells" | jq .
          echo "cells=$cells" >> "$GITHUB_OUTPUT"

  android:
    name: ${{ matrix.cell.id }} on Android
    needs: cells
    # A matrix with no values fails the run, so the job is skipped instead when the role has no cell,
    # as the floor has while React Native still supports it.
    # https://github.com/rust-lang/rust/commit/2632c6139d9b1a7ca7be4da1924e7a78edfa452c
    if: needs.cells.outputs.cells != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.cells.outputs.cells) }}
    env:
      CELL_ID: ${{ matrix.cell.id }}
      CELL_FOLDER: ${{ matrix.cell.folder }}
      CELL_OTA: ${{ matrix.cell.ota }}
      # Where the emulator lists the emulators it runs, which Argent's simulator server reads to find
      # them. Argent's own emulator job sets it too: on a runner it is otherwise unset.
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      # The emulator, read both by the step that installs its system image and by the emulator action.
      EMULATOR_API_LEVEL: 36
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # The action's own cache saves the store from every job under a key of its own, so it is off, and the
      # store is cached here instead: every branch restores it, and only main saves it. A pull request reads
      # the caches of the default branch: https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: false
          install: false
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - name: Save the pnpm store
        if: ${{ github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - run: pnpm build

      - name: Create the runtime directory
        run: mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

      # The Expo examples have no android folder: it is generated, which also gives the cache key below
      # its Gradle files.
      - name: Generate the native project
        if: ${{ matrix.cell.kind == 'expo' }}
        working-directory: ${{ matrix.cell.folder }}
        run: pnpm exec expo prebuild --clean --platform android

      # Only main saves the Gradle cache, after a build that passed; other branches restore main's.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.cell.id }}-${{ hashFiles(format('{0}/android/**/*.gradle*', matrix.cell.folder), 'pnpm-lock.yaml') }}
          restore-keys: gradle-${{ matrix.cell.id }}-

      - name: Install the NDK, the emulator and its system image
        # The emulator action installs the emulator and the system image with no retry, and Gradle downloads
        # the NDK the app pins, which the runner image does not have. A download from Google's repository
        # now and then fails ("Error on ZipFile unknown archive"), so they are installed here, where a failed
        # download is retried, and the action and Gradle find them installed. They are not cached: the
        # repository's caches already exceed their limit, and evict the pods and Gradle caches.
        # The bare apps pin the NDK in `build.gradle`, the Expo apps take React Native's.
        run: |
          NDK=$(grep -ho 'ndkVersion *= *"[0-9.]*"' "$CELL_FOLDER/android/build.gradle" "$CELL_FOLDER/node_modules/react-native/gradle/libs.versions.toml" 2>/dev/null | head -n 1 | grep -o '[0-9][0-9.]*') || true
          if [ -z "$NDK" ]; then
            echo "The NDK version of $CELL_ID was not found." >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" emulator "system-images;android-$EMULATOR_API_LEVEL;$EMULATOR_TARGET;$EMULATOR_ARCH" > /dev/null; then
              exit 0
            fi
            echo "::warning::sdkmanager failed on attempt $attempt."
            sleep 15
          done
          exit 1

      - name: Build the Release and Debug APKs
        working-directory: ${{ matrix.cell.folder }}/android
        # `bash` sets `pipefail`, so a build that fails behind `| tee` fails the attempt.
        shell: bash
        # A dependency or plugin that Gradle could not download fails the build ("Could not resolve"), and
        # the same build passes when run again. Only such a failure is retried: Gradle reuses what it built.
        run: |
          for attempt in 1 2 3; do
            if ./gradlew :app:assembleRelease :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
              exit 0
            fi
            if ! grep -qE 'Could not (resolve|GET|HEAD|download)|Read timed out|Connection reset|Remote host terminated' "$RUNNER_TEMP/gradle.log"; then
              exit 1
            fi
            echo "::warning::Gradle could not download a dependency on attempt $attempt."
          done
          exit 1

      - name: Save the Gradle cache
        if: ${{ github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Start the OTA server for the OTA cell
        # The OTA cell runs the `ota` flow against a local Hot Updater server. The server runs on the
        # host, so it starts in its own step: the emulator action runs its `script` one line at a
        # time, and each line is its own shell.
        if: ${{ matrix.cell.ota }}
        run: |
          npx hot-updater db generate scripts/ota/hotUpdater.mts --yes
          echo "yes" | npx hot-updater db migrate scripts/ota/hotUpdater.mts
          node scripts/ota/server.mts &
          for _ in $(seq 1 30); do curl -sf http://localhost:3000/hot-updater/version && break; sleep 1; done

      - name: Remove the missing page for the page-not-found flow
        # Every cell runs the `page-not-found` flow, which needs a page that is not next to the running
        # bundle. Android serves a release page from the APK's assets, so the example app's `Missing`
        # component's page is removed from the APK and the APK re-signed before the emulator installs it.
        # The strip runs here, in a normal step: the emulator action runs its `script` one line at a time,
        # so a loop or `if` block spanning lines would be split and fail.
        run: |
          APK="$CELL_FOLDER/android/app/build/outputs/apk/release/app-release.apk"
          for js in $(unzip -Z1 "$APK" | grep '^assets/dom\.bundle/.*\.js$'); do
            # No `-q`: `grep -q` closes the pipe as soon as it matches, which under `pipefail` makes
            # `unzip` fail with SIGPIPE. Reading the whole stream keeps the pipeline a success.
            if unzip -p "$APK" "$js" | grep 'use-dom-e2e-missing-page' > /dev/null; then
              zip -d "$APK" "$js" "${js%.js}.html"
            fi
          done
          zip -d "$APK" 'META-INF/*' > /dev/null
          BUILD_TOOLS=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}zipalign" -f 4 "$APK" "$APK.aligned"
          "${BUILD_TOOLS}apksigner" sign --ks "$CELL_FOLDER/android/app/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$APK.aligned"
          mv "$APK.aligned" "$APK"

      # The action shuts the emulator down when this step ends, so the installs and both flow runs
      # happen in its script. Each line runs in its own shell.
      # Expo serves the app's entry from the workspace root, so its bundle path starts with the app's folder.
      - name: Run the release and dev flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          UPDATE_BASELINES: ${{ inputs.update-baselines && '--update-baselines' || '' }}
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: pixel_7
          disable-animations: true
          # -grpc makes the emulator write the file (avd/running/pid_*.ini) that Argent's simulator server
          # reads to find it: without the flag the emulator lists nothing there.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -grpc 8554
          # A busy runner can make System UI miss its start deadline, and the "isn't responding" dialog then
          # covers the app for every flow. With hide_error_dialogs Android kills the process instead of
          # asking: an app that stops answering still fails its flow.
          # `argent server start --detach` kills the server when it doesn't answer within 15 seconds, which
          # a busy runner can exceed. As in the iOS workflow, `argent server start` runs without it as a
          # background job, which waits for the server with no limit, and the loop waits for `server status`.
          # In the foreground the server logs to the CLI's output rather than ~/.argent/tool-server.log.
          # Right after boot, while the emulator still applies its display settings, adb now and then loses it
          # ("device 'emulator-5554' not found") or an install fails with no reason. An install waits for the
          # emulator again and is retried.
          script: |
            adb shell settings put global hide_error_dialogs 1
            nohup adb logcat -v time > logcat.txt 2>&1 &
            nohup pnpm exec argent server start > argent-server.log 2>&1 &
            for _ in $(seq 60); do pnpm exec argent server status --json | grep -q '"running": true' && break; sleep 2; done; pnpm exec argent server status --json | grep -q '"running": true'
            for attempt in 1 2 3; do timeout 120 adb wait-for-device && adb install -r "$CELL_FOLDER/android/app/build/outputs/apk/release/app-release.apk" && break; [ "$attempt" = 3 ] && exit 1; echo "::warning::adb install failed on attempt $attempt."; sleep 10; done
            pnpm e2e "$CELL_ID" release --device emulator-5554 --output e2e-output $UPDATE_BASELINES || { adb exec-out screencap -p > screen.png; adb shell uiautomator dump /sdcard/ui.xml; adb pull /sdcard/ui.xml ui.xml; exit 1; }
            if [ "$CELL_OTA" = true ]; then adb reverse tcp:3000 tcp:3000; fi
            if [ "$CELL_OTA" = true ]; then pnpm e2e "$CELL_ID" ota --device emulator-5554 --output e2e-output --update-baselines; fi
            nohup pnpm --dir "$CELL_FOLDER" start > metro.log 2>&1 &
            for i in $(seq 60); do curl -sf http://localhost:8081/status | grep -q running && break; sleep 2; done; curl -sf http://localhost:8081/status | grep -q running
            adb reverse tcp:8081 tcp:8081
            root=$(case "$CELL_ID" in expo-*) echo "$CELL_FOLDER/" ;; esac); curl -sf --max-time 600 -o /dev/null "http://localhost:8081/${root}index.bundle?platform=android&dev=true&minify=false"
            for c in Note Greeting Lines; do curl -sf --max-time 600 -o /dev/null -G "http://localhost:8081/_dom/entry.bundle" --data-urlencode "dev=true" --data-urlencode "platform=web" --data-urlencode "transform.dom=$GITHUB_WORKSPACE/e2e/example-app/src/$c.tsx"; done
            for attempt in 1 2 3; do timeout 120 adb wait-for-device && adb install -r "$CELL_FOLDER/android/app/build/outputs/apk/debug/app-debug.apk" && break; [ "$attempt" = 3 ] && exit 1; echo "::warning::adb install failed on attempt $attempt."; sleep 10; done
            pnpm e2e "$CELL_ID" dev --device emulator-5554 --output e2e-output $UPDATE_BASELINES

      - name: Upload the new baselines
        if: ${{ inputs.update-baselines && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-android-${{ matrix.cell.id }}-baselines
          path: .argent/flows/${{ matrix.cell.id }}/*/__baselines__

      - name: Upload the Argent output, logcat and Metro log
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-android-${{ matrix.cell.id }}
          path: |
            e2e-output
            logcat.txt
            screen.png
            ui.xml
            metro.log
            argent-server.log
          if-no-files-found: warn
