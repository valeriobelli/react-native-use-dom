name: E2E iOS

on:
  workflow_call:
    inputs:
      role:
        description: 'The cells to run: `blocking` for the ones that gate merges, `floor` for the peer-range floor'
        type: string
        default: blocking
  workflow_dispatch:
    inputs:
      role:
        description: 'The cells to run: `blocking` for the ones that gate merges, `floor` for the peer-range floor'
        type: choice
        options: [blocking, floor]
        default: blocking
      update-baselines:
        description: Write new screenshot baselines on this runner and upload them, instead of comparing
        type: boolean
        default: false

permissions: {}

# A called workflow gets the caller's `github` context, so `github.workflow` alone would give it the
# group of the E2E workflow that calls it, and of the other workflows E2E calls: the platform and the
# role keep the groups apart.
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusable-workflows
concurrency:
  group: ${{ github.workflow }}-ios-${{ inputs.role }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cells:
    name: Read the cells of the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: e2e/matrix.json
      - name: Select the cells
        id: cells
        env:
          ROLE: ${{ inputs.role || 'blocking' }}
        run: |
          case "$ROLE" in
            blocking | floor) ;;
            *)
              echo "The role must be blocking or floor, got \"$ROLE\"." >&2
              exit 1
              ;;
          esac
          CELLS=$(jq -c --arg role "$ROLE" '[.cells[] | select(.role == $role)]' e2e/matrix.json)
          # The floor has no cell of its own while React Native still supports it, so only an empty
          # blocking set is an error.
          if [ "$ROLE" = blocking ] && [ "$(jq 'length' <<< "$CELLS")" -eq 0 ]; then
            echo "e2e/matrix.json has no cell with the role $ROLE." >&2
            exit 1
          fi
          echo "cells=$CELLS" >> "$GITHUB_OUTPUT"
          jq -r '.[].id' <<< "$CELLS"

  test:
    name: ${{ matrix.cell.id }} on ${{ matrix.cell.ios.runner }}
    needs: cells
    # A matrix with no values fails the run, so the job is skipped instead when the role has no cell.
    # https://github.com/rust-lang/rust/commit/2632c6139d9b1a7ca7be4da1924e7a78edfa452c
    if: needs.cells.outputs.cells != '[]'
    runs-on: ${{ matrix.cell.ios.runner }}
    # A cell the overrides allow to fail still shows its failure, but the workflow, and so `e2e-result`,
    # succeeds without it: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idcontinue-on-error
    continue-on-error: ${{ matrix.cell.ios.allowFailure == true }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.cells.outputs.cells) }}
    env:
      # Everything the steps read from the cell goes through the environment, never into a script.
      CELL_ID: ${{ matrix.cell.id }}
      CELL_FOLDER: ${{ matrix.cell.folder }}
      CELL_APP: ${{ matrix.cell.appName }}
      CELL_BUNDLE_ID: ${{ matrix.cell.bundleId }}
      CELL_KIND: ${{ matrix.cell.kind }}
      CELL_XCODE: ${{ matrix.cell.ios.xcode }}
    defaults:
      run:
        # Unlike the default shell, `bash` sets `pipefail`, so a build that fails behind `| tee` fails its
        # step: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepsshell
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the Xcode version
        # Only a cell that names one: the others build with the runner's default Xcode. The paths come from
        # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
        if: matrix.cell.ios.xcode
        run: |
          XCODE_APP="/Applications/Xcode_${CELL_XCODE}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "$XCODE_APP is not installed on this runner." >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP"
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          # Keyed on the hash of `pnpm-lock.yaml`. The action installs the dependencies itself, so the store
          # has to come back before it runs, which a separate cache step cannot do.
          cache: true
          require-lockfile: true
      - run: pnpm build
      - name: Start the Argent tools server
        # The flow runner spawns the server itself and gives it 15 seconds to answer. Once the builds and
        # the simulator run, this runner is too busy for that (`node --version` alone took 35 seconds), so
        # the server starts first, while it is idle, and the flows reuse it.
        # `--detach` gives the server the same 15 seconds and kills it after them, which a macos-26 runner
        # has exceeded even here. In the foreground the CLI records the server at once and waits for it
        # without a limit, so it runs in the background and the loop waits for it to answer.
        # `server status` exits 0 even when the server does not answer: its JSON says whether it runs.
        # Only `--detach` writes ~/.argent/tool-server.log; in the foreground the server logs to the CLI's
        # output, so that output is kept for the failure artifact.
        run: |
          nohup pnpm exec argent server start > argent-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if pnpm exec argent server status --json | grep -q '"running": true'; then
              exit 0
            fi
            sleep 2
          done
          echo "The Argent tools server did not start." >&2
          exit 1
      - name: Create and boot the simulator
        # A new simulator takes minutes to boot and then minutes more of its own work before flows run
        # reliably on it. It boots now, in the background, so that work runs while the app builds.
        run: |
          xcrun simctl list runtimes
          # The newest iOS runtime the runner has: iOS 27.0 on xcode-27, the newest iOS 26 on macos-26.
          RUNTIME=$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
          if [ -z "$RUNTIME" ] || [ "$RUNTIME" = null ]; then
            echo "No iOS runtime is installed on this runner." >&2
            exit 1
          fi
          UDID=$(xcrun simctl create e2e "iPhone 17" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$UDID" > /dev/null 2>&1 &
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Generate the native project
        # An Expo example has no `ios` folder: Expo generates it. `--no-install` leaves the pods to the step
        # below, which installs them with the bundled CocoaPods and after the cache restores `ios/Pods`.
        if: matrix.cell.kind == 'expo'
        working-directory: ${{ matrix.cell.folder }}
        run: pnpm exec expo prebuild --clean --platform ios --no-install
      - name: Print the Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache the pods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cell.folder }}/ios/Pods
          # An Expo example has no committed `Podfile.lock`, so its key falls back to the lockfile of the
          # workspace, which pins the versions the generated `Podfile` resolves.
          key: pods-${{ matrix.cell.id }}-${{ steps.xcode.outputs.version }}-${{ hashFiles(format('{0}/ios/Podfile.lock', matrix.cell.folder)) || hashFiles('pnpm-lock.yaml') }}
      - name: Install the pods
        working-directory: ${{ matrix.cell.folder }}/ios
        # CocoaPods now and then fails with "pathname contains null byte" on a path that exists, and the same
        # install passes when run again: https://github.com/CocoaPods/CocoaPods/issues/12798. Only that error is
        # retried; any other fails the step at once.
        run: |
          for attempt in 1 2 3; do
            if bundle exec pod install 2>&1 | tee "$RUNNER_TEMP/pod-install.log"; then
              exit 0
            fi
            if ! grep -q 'pathname contains null byte' "$RUNNER_TEMP/pod-install.log"; then
              exit 1
            fi
            echo "::warning::pod install hit the CocoaPods null byte error on attempt $attempt."
          done
          exit 1

      - name: Build Release
        working-directory: ${{ matrix.cell.folder }}
        run: |
          xcodebuild \
            -workspace "ios/$CELL_APP.xcworkspace" \
            -scheme "$CELL_APP" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            | tee "$GITHUB_WORKSPACE/xcodebuild-release.log"

      - name: Wait for the simulator
        # It booted while the app built. Once booted it is still busy for minutes: Argent sets up each
        # launch with `simctl spawn … launchctl` and gives the call 10 seconds, which a first flow right
        # after a boot has run out of. The flows start once such a call answers in 5.
        run: |
          # `-b` boots it again if the boot in the background failed.
          xcrun simctl bootstatus "$UDID" -b
          for _ in $(seq 1 60); do
            start=$SECONDS
            xcrun simctl spawn "$UDID" launchctl list > /dev/null || true
            if [ $((SECONDS - start)) -lt 5 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "The simulator still takes 5 seconds or more to answer \`simctl spawn\`." >&2
          exit 1

      - name: Install the Release build
        run: xcrun simctl install "$UDID" "$CELL_FOLDER/build/Build/Products/Release-iphonesimulator/$CELL_APP.app"
      - name: Remove the missing page for the page-not-found flow
        # Every cell runs the `page-not-found` flow, which needs a page that is not next to the running
        # bundle, so the example app's `Missing` component's page is deleted from the installed app
        # before the flows run.
        run: |
          APP=$(xcrun simctl get_app_container "$UDID" "$CELL_BUNDLE_ID" app)
          node "$GITHUB_WORKSPACE/scripts/e2e/remove-page.cli.mts" "$APP/dom.bundle"
      - name: Run the release flows
        env:
          UPDATE_BASELINES: ${{ inputs.update-baselines && '--update-baselines' || '' }}
        run: pnpm e2e "$CELL_ID" release --device "$UDID" --output e2e-output $UPDATE_BASELINES

      - name: Start the OTA server and run the OTA flows
        if: matrix.cell.ota == true
        run: |
          npx hot-updater db generate scripts/ota/hotUpdater.mts --yes
          echo "yes" | npx hot-updater db migrate scripts/ota/hotUpdater.mts
          node scripts/ota/server.mts &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/hot-updater/version; then
              break
            fi
            sleep 1
          done
          pnpm e2e "$CELL_ID" ota --device "$UDID" --output e2e-output --update-baselines
          kill %1 2>/dev/null || true

      - name: Build Debug
        working-directory: ${{ matrix.cell.folder }}
        run: |
          xcodebuild \
            -workspace "ios/$CELL_APP.xcworkspace" \
            -scheme "$CELL_APP" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            | tee "$GITHUB_WORKSPACE/xcodebuild-debug.log"
      - name: Start Metro
        run: |
          pnpm --dir "$CELL_FOLDER" start > metro.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8081/status; then
              exit 0
            fi
            sleep 2
          done
          echo "Metro did not answer on port 8081." >&2
          exit 1
      - name: Warm up the bundles
        # The first bundle takes longer than a flow waits for the app to render, so Metro builds it now.
        # So does the web bundle of each DOM component: a second Metro instance starts on its first
        # request, and a web view that waits for it shows nothing for longer than the flows wait.
        # Metro builds a separate graph for each entry and set of transform options, so the warm-up
        # asks for the bundle the Debug app asks for: a lazy one, and on Expo the virtual entry, which
        # the dev server rewrites with the Hermes transform options the app's bundle is built with.
        run: |
          entry=index
          if [ "$CELL_KIND" = expo ]; then entry=.expo/.virtual-metro-entry; fi
          curl -sf --max-time 600 -o /dev/null "http://localhost:8081/$entry.bundle?platform=ios&dev=true&lazy=true&minify=false"
          for component in Note Greeting Lines; do
            curl -sf --max-time 600 -o /dev/null -G "http://localhost:8081/_dom/entry.bundle" \
              --data-urlencode "dev=true" \
              --data-urlencode "platform=web" \
              --data-urlencode "transform.dom=$GITHUB_WORKSPACE/e2e/example-app/src/$component.tsx"
          done
      - name: Install the Debug build
        run: xcrun simctl install "$UDID" "$CELL_FOLDER/build/Build/Products/Debug-iphonesimulator/$CELL_APP.app"
      - name: Run the dev flows
        env:
          UPDATE_BASELINES: ${{ inputs.update-baselines && '--update-baselines' || '' }}
        run: pnpm e2e "$CELL_ID" dev --device "$UDID" --output e2e-output $UPDATE_BASELINES

      - name: Upload the new baselines
        if: inputs.update-baselines && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ios-${{ matrix.cell.id }}-baselines
          path: .argent/flows/${{ matrix.cell.id }}/*/__baselines__

      - name: Upload the logs and flow output
        # The simulator writes the crash reports of its apps and services to the host's DiagnosticReports:
        # an app that stops answering Argent mid-flow has often crashed.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ios-${{ matrix.cell.id }}
          path: |
            e2e-output
            metro.log
            xcodebuild-release.log
            xcodebuild-debug.log
            argent-server.log
            ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: warn
