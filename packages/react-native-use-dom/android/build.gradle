import groovy.json.JsonSlurper

buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:9.3.1"
  }
}

// The oldest versions this library is built and tested against. Older ones fail here, with the
// requirement named, rather than later with a compiler error.
def MIN_REACT_NATIVE_MINOR = 81
def MIN_SDK_VERSION = 24

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["ReactNativeUseDom_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ReactNativeUseDom_" + name]).toInteger()
}

def reactNativeVersion() {
  def packageJson = providers.exec {
    workingDir rootProject.projectDir
    commandLine "node", "--print", "require.resolve('react-native/package.json')"
    ignoreExitValue true
  }.standardOutput.asText.get().trim()
  def file = new File(packageJson)
  return file.exists() ? new JsonSlurper().parse(file).version : null
}

if (rootProject.hasProperty("newArchEnabled") && !isNewArchitectureEnabled()) {
  throw new GradleException("[react-native-use-dom] The New Architecture is required. Set newArchEnabled=true in android/gradle.properties.")
}
def rnVersion = reactNativeVersion()
if (rnVersion != null && rnVersion.tokenize(".")[1].toInteger() < MIN_REACT_NATIVE_MINOR) {
  throw new GradleException("[react-native-use-dom] React Native 0.${MIN_REACT_NATIVE_MINOR} or newer is required; this app uses ${rnVersion}.")
}
if (getExtOrIntegerDefault("minSdkVersion") < MIN_SDK_VERSION) {
  throw new GradleException("[react-native-use-dom] minSdkVersion ${MIN_SDK_VERSION} or higher is required; this app sets ${getExtOrIntegerDefault("minSdkVersion")}.")
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply from: "../nitrogen/generated/android/ReactNativeUseDom+autolinking.gradle"
apply from: "./fix-prefab.gradle"

android {
  namespace "com.margelo.nitro.usedom"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libc++_shared.so",
      "**/libNitroModules.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libhermes-executor-debug.so",
      "**/libhermes_executor.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
      "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation project(":react-native-nitro-modules")
  implementation "androidx.webkit:webkit:1.17.1"
}
